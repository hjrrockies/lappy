[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lappy"
version = "0.9.0"
description = "Laplacian eigenvalues, eigenfunctions and boundary integrals for planar domains, by the Method of Particular Solutions"
authors = [{name = "Hayden Ringer", email = "hringer@vt.edu"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy >= 2.3",
    "scipy >= 1.14",
    "matplotlib >= 3.9",
    "pygmsh >= 7.1",
    "shapely >= 2.0",
    "gsvd4py>=0.2.2",
    "jupyter>=1.1.1",
    "pytest>=8.4.1",
    "mpmath>=1.0",
    "tqdm>=4.0",
]

# Explicit, because the repo root also holds benchmarks/, tests/, scripts/ and docs/, and
# setuptools' auto-discovery refuses a flat layout with more than one candidate. This used to be
# supplied by setup.py's find_packages(); that file was removed as a duplicate of this one, which
# broke `pip install -e .` for anything downstream until it was declared here.
[tool.setuptools.packages.find]
include = ["lappy*"]

[tool.setuptools.package-data]
lappy = ["data/cubature_rules/*.json"]
